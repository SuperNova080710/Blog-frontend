name: Frontend CI and Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# No repository write access for untrusted PR checks.
permissions:
  contents: read

concurrency:
  group: frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency security audit
        run: npm audit --audit-level=high

      - name: Build Next.js
        run: npm run build

  container-smoke:
    name: Build image and test isolated runtime
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Docker image without publishing
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=/api \
            --tag blog-frontend:ci \
            .

      - name: Run local-only HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name blog-frontend-ci \
            --publish 127.0.0.1:3100:3000 \
            blog-frontend:ci

          trap 'docker logs blog-frontend-ci || true; docker rm -f blog-frontend-ci >/dev/null 2>&1 || true' EXIT

          healthy=false
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3100/; then
              healthy=true
              break
            fi
            sleep 2
          done

          test "$healthy" = true
          curl -fsSI http://127.0.0.1:3100/

          # The Next.js process must not run as root.
          test "$(docker exec blog-frontend-ci id -u)" != "0"

          # Local development env files must not enter the image.
          docker exec blog-frontend-ci sh -c 'test ! -f /app/.env && test ! -f /app/.env.local'

  publish-ghcr:
    name: Publish reviewed main image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Log in to GHCR using repository-scoped token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish commit-addressed image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/supernova080710/blog-frontend:sha-${GITHUB_SHA}"
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=/api \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$image" \
            .
          docker push "$image"
          echo "Published image: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          echo "The image has NOT been deployed to K3s. Production deployment is gated by #24/#34 recovery and security approval." >> "$GITHUB_STEP_SUMMARY"
